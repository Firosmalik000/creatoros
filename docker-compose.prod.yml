name: creatoros-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creatoros}
      POSTGRES_USER: ${POSTGRES_USER:-creatoros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creatoros_prod_secret}
    volumes:
      - postgres-prod-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal-net

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-creatoros_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-creatoros_s3_secret_min16chars}
    volumes:
      - minio-prod-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal-net

  migrate:
    image: creatoros-api:production
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["/creatoros-migrate", "-dir", "/migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://creatoros:creatoros_prod_secret@postgres:5432/creatoros?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  api:
    image: creatoros-api:production
    restart: always
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: production
      API_PORT: 8080
      GOMAXPROCS: "2"
      DATABASE_URL: ${DATABASE_URL:-postgres://creatoros:creatoros_prod_secret@postgres:5432/creatoros?sslmode=disable}
      WEB_ORIGINS: ${WEB_ORIGINS:-https://agensi.xboss.asia}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://agensi.xboss.asia}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@agensi.xboss.asia}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-creatoros-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-creatoros_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-creatoros_s3_secret_min16chars}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net

  web:
    image: creatoros-web:production
    restart: always
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://agensi.xboss.asia}
        API_BASE_URL: ${API_BASE_URL:-http://api:8080/api/v1}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      UV_THREADPOOL_SIZE: "2"
      NODE_OPTIONS: "--max-old-space-size=512"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://agensi.xboss.asia}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080/api/v1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net
      - dokploy-network

networks:
  internal-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
