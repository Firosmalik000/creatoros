      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PayoutMethod"

    PayoutMethodListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PayoutMethod"

    PayoutRequestResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PayoutRequest"

    PayoutRequestListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PayoutRequest"

    # ── Communication Schemas ──────────────────────────────────────────────────
    ConversationParticipant:
      type: object
      required: [thread_id, user_id, last_read_at, joined_at]
      properties:
        thread_id:
          type: string
          format: uuid
        user_id:
