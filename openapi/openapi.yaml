      type: object
      required: [id, thread_id, sender_user_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        sender_name:
          type: string
          example: Alex Brand
        body:
          type: string
          example: Hello creator, looking forward to the shoot!
        created_at:
          type: string
          format: date-time

    ConversationThread:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
