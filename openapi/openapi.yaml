components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: creatoros_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the creatoros_csrf cookie bound to the current session.
      schema:
        type: string
    LocaleQuery:
      name: locale
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Locale"
    CreatorSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        maxLength: 80
    CreatorUserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreatorPublicSlug:
      name: creator_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        maxLength: 80
    ServiceSlug:
      name: service_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        maxLength: 80
    ServiceID:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubmissionID:
      name: submission_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileID:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignID:
      name: campaign_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminUserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminCategoryID:
      name: categoryID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminOrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: The JSON body is malformed, too large, contains unknown fields, or is not a single object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more request fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EmailExists:
      description: The normalized email is already registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidToken:
      description: The one-time token is invalid, expired, or already consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableAuthRequest:
      description: The one-time token is invalid or the new password does not satisfy validation rules.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The network or account-scoped authentication rate limit was exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the current limit window expires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required authentication dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: The credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The account cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid active session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCSRF:
      description: The CSRF cookie and header are missing, different, or not bound to the session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenAction:
      description: The authenticated role or permission cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreatorNotFound:
      description: The creator profile does not exist or is not publicly verified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreatorSlugExists:
      description: The requested public creator slug is already assigned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IncompleteCreatorProfile:
      description: Required creator profile, category, language, social, or portfolio evidence is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCreatorTransition:
      description: The requested creator verification transition is not allowed from the current status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceNotFound:
      description: The service does not exist, is not owned by the caller, or is not public.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceSlugExists:
      description: The creator already uses this service slug.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidServiceTransition:
      description: The service cannot be published because its creator is not active and verified or the service is incomplete.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    OrderNotFound:
      description: The order was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidOrderTransition:
      description: The order cannot transition from its current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SubmissionNotFound:
      description: The submission was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RevisionLimitExceeded:
      description: The order has reached its allowed revision limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    FileNotFound:
      description: The requested deliverable file was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: The uploaded file exceeds the 200MB size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMediaType:
      description: The uploaded file MIME type is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CampaignNotFound:
      description: The requested campaign was not found or access is denied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvitationNotFound:
      description: The requested invitation was not found or access is denied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ServicePackage:
      type: object
      additionalProperties: false
      required:
        [
          name,
          description,
          price_minor,
          currency,
          delivery_days,
          revision_limit,
          sort_order,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        price_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer minor units. IDR has zero fractional digits; MYR and USD use cents.
        currency: { type: string, enum: [IDR, MYR, USD] }
        delivery_days: { type: integer, minimum: 1, maximum: 365 }
        revision_limit: { type: integer, minimum: 0, maximum: 20 }
        sort_order: { type: integer, minimum: 0, maximum: 2 }
    CreatorService:
      type: object
      required:
        [
          id,
          creator_slug,
          creator_display_name,
          slug,
          title,
          description,
          status,
          packages,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        creator_slug: { type: string }
        creator_display_name: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, published] }
        packages:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/ServicePackage" }
        published_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SaveServiceRequest:
      type: object
      additionalProperties: false
      required: [slug, title, description, packages]
      properties:
        slug:
          { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 3000 }
        packages:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/ServicePackage" }
    ServiceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CreatorService" }
    ServiceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CreatorService" }
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, timestamp]
          properties:
            status:
              type: string
              enum: [live, ready, not_ready]
            timestamp:
              type: string
              format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, preferred_locale, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        preferred_locale:
          $ref: "#/components/schemas/Locale"
        role:
          type: string
          enum: [client, creator]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [preferred_locale]
      properties:
        preferred_locale:
          $ref: "#/components/schemas/Locale"
    Locale:
      type: string
      enum: [id, en, ms]
    User:
      type: object
      required:
        [
          id,
          email,
          display_name,
          preferred_locale,
          status,
          roles,
          permissions,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        preferred_locale:
          $ref: "#/components/schemas/Locale"
        status:
          type: string
          enum: [pending_verification, active, disabled]
        email_verified_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          type: object
          additionalProperties:
            type: string
    AcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted:
              type: boolean
        meta:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    CatalogItem:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    SocialAccount:
      type: object
      additionalProperties: false
      required:
        [
          platform_code,
          handle,
          profile_url,
          follower_count,
          average_views,
          engagement_bps,
        ]
      properties:
        platform_code: { type: string }
        platform_name: { type: string }
        handle: { type: string, minLength: 1, maxLength: 100 }
        profile_url: { type: string, format: uri, maxLength: 2048 }
        follower_count: { type: integer, format: int64, minimum: 0 }
        average_views: { type: integer, format: int64, minimum: 0 }
        engagement_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Engagement percentage in basis points; 640 represents 6.40 percent.
    PortfolioItem:
      type: object
      additionalProperties: false
      required: [title, description, media_url, sort_order]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        media_url: { type: string, format: uri, maxLength: 2048 }
        thumbnail_url: { type: string, format: uri, maxLength: 2048 }
        sort_order: { type: integer, minimum: 0 }
    CreatorVerificationStatus:
      type: string
      enum:
        [
          draft,
          submitted,
          under_review,
          revision_required,
          verified,
          rejected,
          suspended,
        ]
    CreatorProfile:
      type: object
      required:
        [
          user_id,
          display_name,
          slug,
          headline,
          bio,
          city,
          country_code,
          verification_status,
          categories,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        bio: { type: string }
        city: { type: string }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        verification_status:
          $ref: "#/components/schemas/CreatorVerificationStatus"
        submitted_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        reviewed_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        review_note: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          items: { $ref: "#/components/schemas/PortfolioItem" }
    PublicCreatorProfile:
      type: object
      required:
        [
          display_name,
          slug,
          headline,
          bio,
          city,
          country_code,
          categories,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        bio: { type: string }
        city: { type: string }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          items: { $ref: "#/components/schemas/PortfolioItem" }
        avatar_url: { type: string, format: uri }
        stats:
          $ref: "#/components/schemas/CreatorPlatformStats"
    CreatorPlatformStats:
      type: object
      required: [total_orders, completed_orders, completion_rate, rating_score, review_count]
      properties:
        total_orders: { type: integer, minimum: 0 }
        completed_orders: { type: integer, minimum: 0 }
        completion_rate: { type: integer, minimum: 0, maximum: 100 }
        rating_score: { type: number, minimum: 0, maximum: 5 }
        review_count: { type: integer, minimum: 0 }
    CreatorOnboarding:
      allOf:
        - $ref: "#/components/schemas/CreatorProfile"
        - type: object
          required: [complete, missing_fields]
          properties:
            complete: { type: boolean }
            missing_fields:
              type: array
              items: { type: string }
    SaveCreatorOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        [
          slug,
          headline,
          bio,
          city,
          country_code,
          category_codes,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        slug:
          { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        headline: { type: string, minLength: 3, maxLength: 120 }
        bio: { type: string, minLength: 20, maxLength: 2000 }
        city: { type: string, minLength: 2, maxLength: 100 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        category_codes:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string }
        languages:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/PortfolioItem" }
    CreatorDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [verified, revision_required, rejected, suspended]
        note: { type: string, maxLength: 1000 }
    CreatorCatalogResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [platforms, categories]
          properties:
            platforms:
              type: array
              items: { $ref: "#/components/schemas/CatalogItem" }
            categories:
              type: array
              items: { $ref: "#/components/schemas/CatalogItem" }
    PublicCreatorProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PublicCreatorProfile" }
    CreatorDirectoryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CreatorDirectoryItem" }
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    CreatorDirectoryItem:
      type: object
      required:
        [
          display_name,
          slug,
          headline,
          city,
          country_code,
          categories,
          languages,
          followers,
          engagement_bps,
          is_favorite,
        ]
      properties:
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        city: { type: string }
        country_code: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        languages:
          type: array
          items: { type: string }
        followers: { type: integer, format: int64, minimum: 0 }
        engagement_bps: { type: integer, minimum: 0 }
        cover_url: { type: string, format: uri }
        is_favorite:
          {
            type: boolean,
            description: True when the signed-in client has saved this creator; false for anonymous visitors.,
          }
    CreatorOnboardingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CreatorOnboarding" }
    CreatorReviewItem:
      type: object
      required:
        [
          user_id,
          display_name,
          slug,
          headline,
          city,
          country_code,
          status,
          updated_at,
        ]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        city: { type: string }
        country_code: { type: string }
        status: { $ref: "#/components/schemas/CreatorVerificationStatus" }
        submitted_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        updated_at: { type: string, format: date-time }
    CreatorReviewQueueResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CreatorReviewItem" }
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    OrderStatus:
      type: string
      enum:
        - pending_acceptance
        - accepted
        - declined
        - in_progress
        - completed
        - cancelled
        - disputed
    Order:
      type: object
      required:
        - id
        - client_user_id
        - creator_user_id
        - service_id
        - package_id
        - package_name
        - package_description
        - price_minor
        - currency
        - delivery_days
        - revision_limit
        - brief_content
        - status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        client_user_id: { type: string, format: uuid }
        client_display_name: { type: string }
        creator_user_id: { type: string, format: uuid }
        creator_display_name: { type: string }
        creator_slug: { type: string }
        service_id: { type: string, format: uuid }
        service_title: { type: string }
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        package_description: { type: string }
        price_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [IDR, MYR, USD] }
        delivery_days: { type: integer, minimum: 1, maximum: 365 }
        revision_limit: { type: integer, minimum: 0, maximum: 20 }
        brief_content: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        accepted_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        deadline_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        cancelled_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BriefVersion:
      type: object
      required:
        - id
        - order_id
        - version
        - content
        - submitted_by
        - created_at
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        content: { type: string }
        submitted_by: { type: string, format: uuid }
        submitted_by_name: { type: string }
        created_at: { type: string, format: date-time }
    OrderEvent:
      type: object
      required:
        - id
        - order_id
        - actor_user_id
        - from_status
        - to_status
        - created_at
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_name: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [briefs, events]
          properties:
            briefs:
              type: array
              items: { $ref: "#/components/schemas/BriefVersion" }
            events:
              type: array
              items: { $ref: "#/components/schemas/OrderEvent" }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [service_id, package_id, brief_content]
      properties:
        service_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        brief_content: { type: string, minLength: 20, maxLength: 5000 }
    OrderActionRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
    SubmitBriefRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 20, maxLength: 5000 }
    OrderResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Order" }
    OrderDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/OrderDetail" }
    OrderListResponse:
      type: object
