openapi: 3.1.0
info:
  title: CreatorOS API
  version: 0.3.0
  description: REST contract for the CreatorOS modular monolith.
servers:
  - url: http://localhost:8080
    description: Local API
security: []
tags:
  - name: Health
    description: Process and dependency health checks.
  - name: Authentication
    description: Account registration, verification, sessions, and password recovery.
  - name: Users
    description: Authenticated user profile and preference operations.
  - name: Creators
    description: Creator onboarding, verification, and public profile operations.
  - name: Catalog
    description: Public creator platform and category reference data.
  - name: Administration
    description: Privileged agency review operations.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is live
      tags: [Health]
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API and database are ready
      tags: [Health]
      responses:
        "200":
          description: The API and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a client or creator account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. Production queues a verification email; local and test environments include a development verification token in meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify a registered email address
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a cookie-backed user session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Sets HttpOnly session and CSRF cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset without revealing account existence
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Request accepted. Production queues email for eligible accounts; local and test environments may include a development reset token in meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password and revoke existing sessions
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password updated and existing sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableAuthRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users/me/settings:
    patch:
      operationId: updateCurrentUserSettings
      summary: Update authenticated user settings
      tags: [Users]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/catalog/creator-options:
    get:
      operationId: listCreatorOptions
      summary: List active creator platforms and localized categories
      tags: [Catalog]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Creator onboarding catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorCatalogResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/creators:
    get:
      operationId: listCreatorDirectory
      summary: Discover verified creators with search, filters, sorting, and pagination
      tags: [Creators]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - {
            name: category,
            in: query,
            schema: { type: string, pattern: "^[a-z0-9-]+$" },
          }
        - {
            name: language,
            in: query,
            schema: { $ref: "#/components/schemas/Locale" },
          }
        - {
            name: country,
            in: query,
            schema: { type: string, pattern: "^[A-Z]{2}$" },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [featured, followers, engagement, newest],
                default: featured,
              },
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 48, default: 24 },
          }
      responses:
        "200":
          description: Paginated verified creator directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorDirectoryResponse" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/favorites:
    get:
      operationId: listCreatorFavorites
      summary: List the authenticated client's favorite creators
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 48, default: 24 },
          }
      responses:
        "200":
          description: Favorite creator directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorDirectoryResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenAction" }
  /api/v1/me/favorites/{slug}:
    post:
      operationId: addCreatorFavorite
      summary: Add a verified creator to favorites
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Favorite added or already present. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "404": { $ref: "#/components/responses/CreatorNotFound" }
    delete:
      operationId: removeCreatorFavorite
      summary: Remove a creator from favorites
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Favorite removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
  /api/v1/creators/{slug}:
    get:
      operationId: getPublicCreatorProfile
      summary: Return a verified creator public profile
      tags: [Creators]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Verified creator profile. Draft, rejected, suspended, and otherwise non-verified profiles are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCreatorProfileResponse"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
  /api/v1/creators/me/onboarding:
    get:
      operationId: getCreatorOnboarding
      summary: Return the current creator onboarding state
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Current creator onboarding state, including completeness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
    put:
      operationId: saveCreatorOnboarding
      summary: Atomically replace the current creator profile and evidence
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCreatorOnboardingRequest"
      responses:
        "200":
          description: Draft saved. Editing any previously reviewed profile returns it to draft and removes public visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "409":
          $ref: "#/components/responses/CreatorSlugExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/creators/me/verification-submissions:
    post:
      operationId: submitCreatorVerification
      summary: Submit a complete creator profile for agency review
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Creator profile submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "409":
          $ref: "#/components/responses/InvalidCreatorTransition"
        "422":
          $ref: "#/components/responses/IncompleteCreatorProfile"
  /api/v1/admin/creator-verifications:
    get:
      operationId: listCreatorVerifications
      summary: List creator profiles by verification status
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CreatorVerificationStatus"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated verification queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorReviewQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
  /api/v1/admin/creator-verifications/{user_id}:
    get:
      operationId: getCreatorVerification
      summary: Return a complete creator profile for agency review
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CreatorUserID"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Complete creator review evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
  /api/v1/admin/creator-verifications/{user_id}/decisions:
    post:
      operationId: reviewCreatorVerification
      summary: Record an agency creator-verification decision
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CreatorUserID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorDecisionRequest"
      responses:
        "200":
          description: Decision recorded with an immutable verification event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
        "409":
          $ref: "#/components/responses/InvalidCreatorTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: creatoros_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the creatoros_csrf cookie bound to the current session.
      schema:
        type: string
    LocaleQuery:
      name: locale
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Locale"
    CreatorSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        maxLength: 80
    CreatorUserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The JSON body is malformed, too large, contains unknown fields, or is not a single object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more request fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EmailExists:
      description: The normalized email is already registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidToken:
      description: The one-time token is invalid, expired, or already consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableAuthRequest:
      description: The one-time token is invalid or the new password does not satisfy validation rules.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The network or account-scoped authentication rate limit was exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the current limit window expires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required authentication dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: The credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The account cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid active session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCSRF:
      description: The CSRF cookie and header are missing, different, or not bound to the session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenAction:
      description: The authenticated role or permission cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreatorNotFound:
      description: The creator profile does not exist or is not publicly verified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreatorSlugExists:
      description: The requested public creator slug is already assigned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IncompleteCreatorProfile:
      description: Required creator profile, category, language, social, or portfolio evidence is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCreatorTransition:
      description: The requested creator verification transition is not allowed from the current status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, timestamp]
          properties:
            status:
              type: string
              enum: [live, ready, not_ready]
            timestamp:
              type: string
              format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, preferred_locale, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        preferred_locale:
          $ref: "#/components/schemas/Locale"
        role:
          type: string
          enum: [client, creator]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [preferred_locale]
      properties:
        preferred_locale:
          $ref: "#/components/schemas/Locale"
    Locale:
      type: string
      enum: [id, en, ms]
    User:
      type: object
      required:
        [
          id,
          email,
          display_name,
          preferred_locale,
          status,
          roles,
          permissions,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        preferred_locale:
          $ref: "#/components/schemas/Locale"
        status:
          type: string
          enum: [pending_verification, active, disabled]
        email_verified_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          type: object
          additionalProperties:
            type: string
    AcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted:
              type: boolean
        meta:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    CatalogItem:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    SocialAccount:
      type: object
      additionalProperties: false
      required:
        [
          platform_code,
          handle,
          profile_url,
          follower_count,
          average_views,
          engagement_bps,
        ]
      properties:
        platform_code: { type: string }
        platform_name: { type: string }
        handle: { type: string, minLength: 1, maxLength: 100 }
        profile_url: { type: string, format: uri, maxLength: 2048 }
        follower_count: { type: integer, format: int64, minimum: 0 }
        average_views: { type: integer, format: int64, minimum: 0 }
        engagement_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Engagement percentage in basis points; 640 represents 6.40 percent.
    PortfolioItem:
      type: object
      additionalProperties: false
      required: [title, description, media_url, sort_order]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        media_url: { type: string, format: uri, maxLength: 2048 }
        thumbnail_url: { type: string, format: uri, maxLength: 2048 }
        sort_order: { type: integer, minimum: 0 }
    CreatorVerificationStatus:
      type: string
      enum:
        [
          draft,
          submitted,
          under_review,
          revision_required,
          verified,
          rejected,
          suspended,
        ]
    CreatorProfile:
      type: object
      required:
        [
          user_id,
          display_name,
          slug,
          headline,
          bio,
          city,
          country_code,
          verification_status,
          categories,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        bio: { type: string }
        city: { type: string }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        verification_status:
          $ref: "#/components/schemas/CreatorVerificationStatus"
        submitted_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        reviewed_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        review_note: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          items: { $ref: "#/components/schemas/PortfolioItem" }
    PublicCreatorProfile:
      type: object
      required:
        [
          display_name,
          slug,
          headline,
          bio,
          city,
          country_code,
          categories,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        display_name: { type: string }
        slug: { type: string }
        headline: { type: string }
        bio: { type: string }
        city: { type: string }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          items: { $ref: "#/components/schemas/PortfolioItem" }
    CreatorOnboarding:
      allOf:
        - $ref: "#/components/schemas/CreatorProfile"
        - type: object
          required: [complete, missing_fields]
          properties:
            complete: { type: boolean }
            missing_fields:
              type: array
              items: { type: string }
    SaveCreatorOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        [
          slug,
          headline,
          bio,
          city,
          country_code,
          category_codes,
          languages,
          social_accounts,
          portfolio,
        ]
      properties:
        slug:
          { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        headline: { type: string, minLength: 3, maxLength: 120 }
        bio: { type: string, minLength: 20, maxLength: 2000 }
        city: { type: string, minLength: 2, maxLength: 100 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        category_codes:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string }
        languages:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Locale" }
        social_accounts:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SocialAccount" }
        portfolio:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/PortfolioItem" }
    CreatorDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [verified, revision_required, rejected, suspended]
        note: { type: string, maxLength: 1000 }
    CreatorCatalogResponse:
