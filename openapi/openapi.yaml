    # ── Payments ──────────────────────────────────────────────────────────────
    Payment:
      type: object
      required: [id, client_user_id, creator_user_id, amount_minor, currency, status, payment_method, provider, provider_transaction_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        client_user_id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
          description: Payment amount in minor currency units (integer, no floating-point).
        currency:
          type: string
          enum: [IDR, MYR, USD]
        status:
          type: string
          enum: [pending, escrow_held, released, refunded, failed]
        payment_method:
          type: string
        provider:
          type: string
        provider_transaction_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LedgerEntry:
      type: object
      required: [id, transaction_id, reference_type, reference_id, account_type, entry_type, amount_minor, currency, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        reference_type:
          type: string
          enum: [order_escrow, commission, creator_payout, refund]
        reference_id:
          type: string
          format: uuid
        account_type:
          type: string
          enum: [client_cash, platform_escrow, creator_balance, platform_commission, payout_reserve]
        user_id:
          type: string
          format: uuid
        entry_type:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR, MYR, USD]
        description:
          type: string
        created_at:
          type: string
          format: date-time

    CreatorWallet:
      type: object
      required: [creator_user_id, available_balance_minor, escrow_balance_minor, total_withdrawn_minor, currency, updated_at]
      properties:
        creator_user_id:
          type: string
          format: uuid
        available_balance_minor:
          type: integer
          format: int64
        escrow_balance_minor:
          type: integer
          format: int64
        total_withdrawn_minor:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR, MYR, USD]
        updated_at:
          type: string
          format: date-time

    PayoutMethod:
      type: object
      required: [id, creator_user_id, payout_type, bank_name, account_number, account_holder_name, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        payout_type:
          type: string
          enum: [bank_transfer, e_wallet]
        bank_name:
          type: string
        account_number:
          type: string
        account_holder_name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PayoutRequest:
      type: object
      required: [id, creator_user_id, amount_minor, currency, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        payout_method_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          enum: [IDR, MYR, USD]
        status:
          type: string
          enum: [pending, processing, completed, rejected]
        reference_note:
          type: string
        processed_at:
          type: string
          format: date-time
        bank_name:
          type: string
        account_number:
          type: string
        account_holder_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PayOrderRequest:
      type: object
      properties:
        payment_method:
          type: string
          enum: [simulated, bank_transfer, credit_card, e_wallet]
          default: simulated

    SavePayoutMethodRequest:
      type: object
      required: [payout_type, bank_name, account_number, account_holder_name]
      properties:
        payout_type:
          type: string
          enum: [bank_transfer, e_wallet]
        bank_name:
          type: string
          minLength: 2
          maxLength: 100
        account_number:
          type: string
          minLength: 3
          maxLength: 50
        account_holder_name:
          type: string
          minLength: 2
          maxLength: 100

    RequestPayoutRequest:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: "Minimum: IDR 100,000 | MYR 5,000 | USD 1,000 (in minor units)"
        currency:
          type: string
          enum: [IDR, MYR, USD]
        payout_method_id:
          type: string
          format: uuid

    ProcessPayoutRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 500

    PaymentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Payment"

