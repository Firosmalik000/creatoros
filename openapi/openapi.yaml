openapi: 3.1.0
info:
  title: CreatorOS API
  version: 0.10.0
  description: REST contract for the CreatorOS modular monolith.
servers:
  - url: http://localhost:8080
    description: Local API
security: []
tags:
  - name: Health
    description: Process and dependency health checks.
  - name: Authentication
    description: Account registration, verification, sessions, and password recovery.
  - name: Users
    description: Authenticated user profile and preference operations.
  - name: Creators
    description: Creator onboarding, verification, and public profile operations.
  - name: Services
    description: Creator-owned service offers, packages, publication, and public selection.
  - name: Orders
    description: Order placement, state machine transitions, brief versions, and timeline.
  - name: Workflow
    description: Content submissions, revisions, deliverable files, and approval workflows.
  - name: Campaigns
    description: Client campaign creation, requirements, creator matching, invitations, and state transitions.
  - name: Payments
    description: Order payments, escrow management, creator wallets, payout methods, payout requests, and webhooks.
  - name: Communication
    description: Order and campaign messaging threads, real-time in-app notifications, and preferences.
  - name: Catalog
    description: Public creator platform and category reference data.
  - name: Administration
    description: Privileged agency review operations.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is live
      tags: [Health]
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API and database are ready
      tags: [Health]
      responses:
        "200":
          description: The API and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a client or creator account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. Production queues a verification email; local and test environments include a development verification token in meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify a registered email address
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a cookie-backed user session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Sets HttpOnly session and CSRF cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Authentication]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset without revealing account existence
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Request accepted. Production queues email for eligible accounts; local and test environments may include a development reset token in meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password and revoke existing sessions
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password updated and existing sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableAuthRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/users/me/settings:
    patch:
      operationId: updateCurrentUserSettings
      summary: Update authenticated user settings
      tags: [Users]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/catalog/creator-options:
    get:
      operationId: listCreatorOptions
      summary: List active creator platforms and localized categories
      tags: [Catalog]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Creator onboarding catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorCatalogResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/creators:
    get:
      operationId: listCreatorDirectory
      summary: Discover verified creators with search, filters, sorting, and pagination
      description: Public directory. A valid session cookie personalizes is_favorite; anonymous or expired sessions see false. Responses are private and not cacheable.
      tags: [Creators]
      security: [{}, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - {
            name: category,
            in: query,
            schema: { type: string, pattern: "^[a-z0-9-]+$" },
          }
        - {
            name: language,
            in: query,
            schema: { $ref: "#/components/schemas/Locale" },
          }
        - {
            name: country,
            in: query,
            schema: { type: string, pattern: "^[A-Z]{2}$" },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [featured, followers, engagement, newest],
                default: featured,
              },
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 48, default: 24 },
          }
      responses:
        "200":
          description: Paginated verified creator directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorDirectoryResponse" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/favorites:
    get:
      operationId: listCreatorFavorites
      summary: List the authenticated client's favorite creators
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 48, default: 24 },
          }
      responses:
        "200":
          description: Favorite creator directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorDirectoryResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenAction" }
  /api/v1/me/favorites/{slug}:
    post:
      operationId: addCreatorFavorite
      summary: Add a verified creator to favorites
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Favorite added or already present. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "404": { $ref: "#/components/responses/CreatorNotFound" }
    delete:
      operationId: removeCreatorFavorite
      summary: Remove a creator from favorites
      tags: [Creators]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Favorite removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
  /api/v1/creators/{slug}:
    get:
      operationId: getPublicCreatorProfile
      summary: Return a verified creator public profile
      tags: [Creators]
      parameters:
        - $ref: "#/components/parameters/CreatorSlug"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Verified creator profile. Draft, rejected, suspended, and otherwise non-verified profiles are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCreatorProfileResponse"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
  /api/v1/creators/{creator_slug}/services:
    get:
      operationId: listPublicCreatorServices
      summary: List published services for a verified creator
      tags: [Services]
      parameters:
        - $ref: "#/components/parameters/CreatorPublicSlug"
      responses:
        "200":
          description: Published creator services, or an empty list when the verified creator has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "404": { $ref: "#/components/responses/CreatorNotFound" }
  /api/v1/creators/{creator_slug}/services/{service_slug}:
    get:
      operationId: getPublicCreatorService
      summary: Return a published creator service and selectable packages
      tags: [Services]
      parameters:
        - $ref: "#/components/parameters/CreatorPublicSlug"
        - $ref: "#/components/parameters/ServiceSlug"
      responses:
        "200":
          description: Published service owned by an active, verified creator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "404": { $ref: "#/components/responses/ServiceNotFound" }
  /api/v1/creators/me/services:
    get:
      operationId: listOwnCreatorServices
      summary: List the authenticated creator's services
      tags: [Services]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Creator-owned draft and published services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenAction" }
    post:
      operationId: createCreatorService
      summary: Create a creator service draft with packages
      tags: [Services]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "201":
          description: Service draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "409": { $ref: "#/components/responses/ServiceSlugExists" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/creators/me/services/{service_id}:
    get:
      operationId: getOwnCreatorService
      summary: Return one service owned by the authenticated creator
      tags: [Services]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: Creator-owned service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenAction" }
        "404": { $ref: "#/components/responses/ServiceNotFound" }
    put:
      operationId: updateOwnCreatorService
      summary: Replace an owned service and return it to draft
      tags: [Services]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "200":
          description: Service and packages atomically replaced; publication cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "404": { $ref: "#/components/responses/ServiceNotFound" }
        "409": { $ref: "#/components/responses/ServiceSlugExists" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/creators/me/services/{service_id}/publish:
    post:
      operationId: publishOwnCreatorService
      summary: Publish a complete service owned by a verified creator
      tags: [Services]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Service published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "404": { $ref: "#/components/responses/ServiceNotFound" }
        "409": { $ref: "#/components/responses/InvalidServiceTransition" }
  /api/v1/creators/me/services/{service_id}/unpublish:
    post:
      operationId: unpublishOwnCreatorService
      summary: Return a published creator service to draft
      tags: [Services]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Service returned to draft and removed from public reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InvalidCSRF" }
        "404": { $ref: "#/components/responses/ServiceNotFound" }
  /api/v1/creators/me/onboarding:
    get:
      operationId: getCreatorOnboarding
      summary: Return the current creator onboarding state
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Current creator onboarding state, including completeness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
    put:
      operationId: saveCreatorOnboarding
      summary: Atomically replace the current creator profile and evidence
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCreatorOnboardingRequest"
      responses:
        "200":
          description: Draft saved. Editing any previously reviewed profile returns it to draft and removes public visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "409":
          $ref: "#/components/responses/CreatorSlugExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/creators/me/verification-submissions:
    post:
      operationId: submitCreatorVerification
      summary: Submit a complete creator profile for agency review
      tags: [Creators]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Creator profile submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "409":
          $ref: "#/components/responses/InvalidCreatorTransition"
        "422":
          $ref: "#/components/responses/IncompleteCreatorProfile"
  /api/v1/admin/creator-verifications:
    get:
      operationId: listCreatorVerifications
      summary: List creator profiles by verification status
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CreatorVerificationStatus"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated verification queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorReviewQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
  /api/v1/admin/creator-verifications/{user_id}:
    get:
      operationId: getCreatorVerification
      summary: Return a complete creator profile for agency review
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CreatorUserID"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Complete creator review evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
  /api/v1/admin/creator-verifications/{user_id}/decisions:
    post:
      operationId: reviewCreatorVerification
      summary: Record an agency creator-verification decision
      tags: [Administration]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CreatorUserID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LocaleQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorDecisionRequest"
      responses:
        "200":
          description: Decision recorded with an immutable verification event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "404":
          $ref: "#/components/responses/CreatorNotFound"
        "409":
          $ref: "#/components/responses/InvalidCreatorTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/orders:
    get:
      operationId: listClientOrders
      summary: List authenticated client's orders
      tags: [Orders]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of client orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrder
      summary: Place an order for a published creator service package
      tags: [Orders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order placed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InvalidCSRF"
        "404":
          $ref: "#/components/responses/ServiceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/orders/{order_id}:
    get:
      operationId: getClientOrder
      summary: Get order detail with brief versions and events as client
      tags: [Orders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
  /api/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order before it enters progress
      tags: [Orders]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionRequest"
