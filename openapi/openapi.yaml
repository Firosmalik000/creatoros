          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ConversationParticipant"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          example: Hello, please check the lighting requirements for tomorrow.

    Notification:
      type: object
      required: [id, user_id, kind, title, body, action_url, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - order_update
            - submission_received
            - revision_requested
            - submission_approved
            - payment_received
            - escrow_released
            - payout_update
            - campaign_invitation
            - campaign_response
            - new_message
            - system
        title:
          type: string
          example: New message received
        body:
          type: string
          example: Hello, please check the lighting requirements for tomorrow.
        action_url:
          type: string
          example: /orders/00000000-0000-0000-0000-000000000001
        is_read:
          type: boolean
          example: false
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      required: [user_id, email_notifications, order_updates, messages, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        email_notifications:
          type: boolean
          example: true
        order_updates:
          type: boolean
          example: true
        messages:
          type: boolean
          example: true
        updated_at:
          type: string
          format: date-time

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        email_notifications:
          type: boolean
        order_updates:
          type: boolean
        messages:
          type: boolean

    ConversationThreadResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ConversationThread"

    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Message"

