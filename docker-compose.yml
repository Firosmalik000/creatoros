name: creatoros

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creatoros}
      POSTGRES_USER: ${POSTGRES_USER:-creatoros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creatoros_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-creatoros}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-creatoros_local_only}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: creatoros-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: local
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://creatoros:creatoros_local_only@postgres:5432/creatoros?sslmode=disable}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: creatoros-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["/creatoros-migrate", "-dir", "/migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://creatoros:creatoros_local_only@postgres:5432/creatoros?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
      API_BASE_URL: http://api:8080/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
