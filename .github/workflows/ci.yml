name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace=@creatoros/web
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: creatoros_test
          POSTGRES_USER: creatoros
          POSTGRES_PASSWORD: creatoros_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatoros -d creatoros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
      - run: go run ./cmd/migrate -dir ./migrations
        env:
          DATABASE_URL: postgres://creatoros:creatoros_test_only@localhost:5432/creatoros_test?sslmode=disable
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://creatoros:creatoros_test_only@localhost:5432/creatoros_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: go build ./cmd/server
